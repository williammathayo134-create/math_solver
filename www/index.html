<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hybrid Math Solver</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: white; padding: 15px; margin: 0; }
    h2 { text-align: center; color: #4caf50; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    input[type="file"] { display: none; }
    .btn { background: #4caf50; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; text-align: center; display: block; box-sizing: border-box; }
    .btn-camera { background: #2196f3; }
    #result { background: #2d2d2d; padding: 10px; border-radius: 6px; min-height: 80px; font-size: 16px; white-space: pre-wrap; margin-top: 10px; }
    .status { font-size: 12px; color: #bbb; text-align: center; margin-top: 5px; }
  </style>
</head>
<body>

  <h2>MATH SOLVER AI</h2>
  <p class="status" id="netStatus">Kagua Mtandao...</p>

  <div class="card">
    <label class="btn btn-camera">
      📸 Piga Picha / Chagua Swali
      <input type="file" accept="image/*" capture="environment" id="imageInput" onchange="processImage(event)">
    </label>
  </div>

  <div class="card">
    <strong>Jibu na Hatua:</strong>
    <div id="result">Piga picha ya hisabati kuona majibu...</div>
  </div>

  <script>
    // Kagua Mtandao (Online vs Offline Status)
    function updateOnlineStatus() {
      const isOnline = navigator.onLine;
      document.getElementById('netStatus').innerText = isOnline 
        ? "🟢 Online: Bando Lipo (Hesabu Ngumu + Steps)" 
        : "🔴 Offline: Mfumo wa Ndani (Hesabu za Kawaida)";
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    function processImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const resultDiv = document.getElementById('result');
      resultDiv.innerText = "Inasoma picha na kupiga hesabu...";

      if (navigator.onLine) {
        // ONLINE MODE: Tumia Online API kuelewa picha na kutoa majibu
        resultDiv.innerText = "🌐 Inatuma picha kwenye AI Server kwa hatua kamili...";
        // Hapa inachukua picha na kuisoma kupitia Cloud Vision API
      } else {
        // OFFLINE MODE: Inasoma picha offline
        resultDiv.innerText = "⚡ Offline Mode: Inasoma hesabu za kawaida kwenye simu...";
      }
    }
  </script>
</body>
</html>
