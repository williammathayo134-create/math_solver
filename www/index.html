<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Solver AI</title>
  <style>
    body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 15px; }
    h2 { color: #4CAF50; text-align: center; margin-bottom: 5px; }
    .status { text-align: center; font-size: 12px; color: #888; margin-bottom: 15px; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    button { width: 100%; padding: 12px; background: #2196F3; color: white; border: none; border-radius: 5px; font-weight: bold; margin-bottom: 8px; cursor: pointer; }
    textarea { width: 100%; height: 70px; background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 5px; padding: 8px; box-sizing: border-box; resize: none; margin-bottom: 8px; }
    .result-box { background: #2b2b2b; padding: 12px; border-radius: 5px; min-height: 100px; font-size: 14px; white-space: pre-wrap; line-height: 1.5; }
  </style>
</head>
<body>

  <h2>MATH SOLVER AI</h2>
  <div class="status">🟢 Online: Groq Engine Active</div>

  <!-- MANUAL INPUT -->
  <div class="card">
    <label style="font-size: 13px; display: block; margin-bottom: 5px;">Andika Hesabu Hapa:</label>
    <textarea id="manualMath" placeholder="Mfano: Solve 2x + 5 = 15 au calculate d/dx(x^3)"></textarea>
    <button onclick="solveManualText()">Solve kwa Groq AI</button>
  </div>

  <!-- PICHA -->
  <div class="card">
    <input type="file" id="imageInput" accept="image/*" capture="environment" style="display:none;" onchange="processImage(event)">
    <button onclick="document.getElementById('imageInput').click()" style="background: #008CBA;">📸 Piga Picha / Chagua Swali</button>
  </div>

  <!-- MAJIBU -->
  <div class="card">
    <strong>Jibu na Hatua:</strong>
    <div id="output" class="result-box">Ingiza hesabu au piga picha kupata hatua...</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
