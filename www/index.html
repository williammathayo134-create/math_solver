<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Solver AI</title>
  <style>
    body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 12px; }
    h2 { color: #4CAF50; text-align: center; margin: 10px 0 2px 0; font-size: 22px; }
    .status { text-align: center; font-size: 12px; color: #4CAF50; margin-bottom: 12px; }
    .card { background: #1e1e1e; padding: 12px; border-radius: 10px; margin-bottom: 12px; }

    /* Calculator Screen */
    #manualMath {
      width: 100%; height: 55px; background: #000; color: #00ffcc;
      border: 1px solid #333; border-radius: 6px; padding: 8px;
      box-sizing: border-box; font-size: 20px; font-family: monospace;
      margin-bottom: 10px; text-align: right; resize: none;
    }

    /* Keypad Grid */
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
    .btn-calc { padding: 14px 0; background: #2c2c2c; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; }
    .btn-calc:active { background: #444; }
    .btn-op { background: #FF9800; color: #000; }
    .btn-equal { background: #4CAF50; color: #fff; grid-column: span 2; }
    .btn-clear { background: #f44336; color: #fff; }

    /* Action Buttons */
    .btn-action { width: 100%; padding: 12px; background: #2196F3; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; margin-bottom: 8px; }
    .btn-action:active { opacity: 0.8; }
    .result-box { background: #2b2b2b; padding: 12px; border-radius: 6px; min-height: 80px; font-size: 14px; white-space: pre-wrap; line-height: 1.5; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

  <h2>MATH SOLVER AI</h2>
  <div class="status">🟢 Online & Offline Calculator</div>

  <!-- CALCULATOR PAD -->
  <div class="card">
    <textarea id="manualMath" placeholder="0"></textarea>

    <div class="calc-grid">
      <button class="btn-calc btn-clear" onclick="clearCalc()">C</button>
      <button class="btn-calc" onclick="appendCalc('(')">(</button>
      <button class="btn-calc" onclick="appendCalc(')')">)</button>
      <button class="btn-calc btn-op" onclick="appendCalc('/')">÷</button>

      <button class="btn-calc" onclick="appendCalc('7')">7</button>
      <button class="btn-calc" onclick="appendCalc('8')">8</button>
      <button class="btn-calc" onclick="appendCalc('9')">9</button>
      <button class="btn-calc btn-op" onclick="appendCalc('*')">×</button>

      <button class="btn-calc" onclick="appendCalc('4')">4</button>
      <button class="btn-calc" onclick="appendCalc('5')">5</button>
      <button class="btn-calc" onclick="appendCalc('6')">6</button>
      <button class="btn-calc btn-op" onclick="appendCalc('-')">-</button>

      <button class="btn-calc" onclick="appendCalc('1')">1</button>
      <button class="btn-calc" onclick="appendCalc('2')">2</button>
      <button class="btn-calc" onclick="appendCalc('3')">3</button>
      <button class="btn-calc btn-op" onclick="appendCalc('+')">+</button>

      <button class="btn-calc" onclick="appendCalc('0')">0</button>
      <button class="btn-calc" onclick="appendCalc('.')">.</button>
      <button class="btn-calc btn-equal" onclick="calculateLocal()">=</button>
    </div>

    <button class="btn-action" onclick="solveManualText()">Fafanua kwa Math Solver AI</button>
  </div>

  <!-- PICHA -->
  <div class="card">
    <input type="file" id="imageInput" accept="image/*" capture="environment" style="display:none" onchange="processImage(event)">
    <button class="btn-action" onclick="document.getElementById('imageInput').click()">📸 Piga Picha / Chagua Picha</button>
  </div>

  <!-- WAJIBU -->
  <div class="card">
    <strong>Jibu na Hatua:</strong>
    <div id="output" class="result-box">Ingiza hesabu au ubonyeze vitufe kupata majibu...</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
